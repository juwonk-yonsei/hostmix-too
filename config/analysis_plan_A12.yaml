# Post hoc ablation plan A12. Commit this file before any ablation fit.
# This is not a hypothesis test. Do not edit this file after the fits exist.
status: post_hoc_descriptive
seed_bootstrap: 20261001
n_bootstrap: 2000
bootstrap: patient-level paired mean via scripts/stage5_lib.py paired_mean
bootstrap_note: each contrast calls paired_mean, which starts Generator(20261001) again

shared_with_stage2:
  model: multinomial L2 logistic
  class_weight: balanced
  solver: lbfgs
  max_iter: 5000
  features: B0 5000 genes, within-sample rank-normal Z
  pure_rows: 7486
  pure_source: TCGA-train in config/split_tcga.tsv
  mix_count_per_tumor: 4
  rho: numpy Generator.uniform(0.15, 1.0), half-open
  host_draw: uniform tissue from the sorted host pool, then a uniform GTEx-ref sample of that tissue
  sa_records: regenerate with the stage-2 SA seed in results/stage2/augmentation_seeds.json and compare with results/stage2/mixes_SA.parquet

models:
  PURE-Zs:
    mixture: none
    scaling: StandardScaler, same call as SA-Z
    C: 0.03
    purpose: SA-Z without the mixtures
  PURE-Zs-w:
    mixture: none
    scaling: StandardScaler, same call as SA-Z
    C: 0.15
    purpose: match the total penalty weight of SA-Z, which has five times as many rows
  MIX-Z0:
    mixture: the same mixture rows as SA-Z
    scaling: none
    C: 0.1
    purpose: BASE-Z plus the mixtures only

regeneration_check:
  action: refit the SA-Z pipeline on the regenerated matrix
  coefficient_max_abs: 1.0e-6
  met500_top1_mismatch: 0
  on_failure: do not fit MIX-Z0; stop the ablation and report

evaluation:
  cohorts: [MET500, POG570, aux_rnaseq]
  metrics: [top1, host_rate, native_truth_top1]
  sets: import the set builders and metric_row from scripts/31_score_A8.py
  differences:
    - PURE-Zs minus BASE-Z
    - SA-Z minus PURE-Zs
    - PURE-Zs-w minus BASE-Z
    - SA-Z minus PURE-Zs-w
    - MIX-Z0 minus BASE-Z
    - SA-Z minus MIX-Z0

reading_rule:
  gap: g = BASE-Z host_rate minus SA-Z host_rate, within each cohort
  share_pure: (PURE host_rate minus SA-Z host_rate) / g
  share_mix: (BASE-Z host_rate minus MIX-Z0 host_rate) / g
  shares: [PURE-Zs, PURE-Zs-w, MIX-Z0]
  pass_if: every share is at least 0.5 in all three cohorts
  on_pass: one Methods paragraph, one Results paragraph, one Additional file 2 sheet
  on_fail: do not add those three items and do not edit claim or conclusion sentences
