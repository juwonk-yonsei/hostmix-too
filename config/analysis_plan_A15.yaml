# Post hoc ablation plan A15. Commit this file before any of these models
# is applied to microarray profiles or to gene-restricted profiles.
# This is not a hypothesis test. Do not edit this file after those scores exist.
status: post_hoc
no_interval: true
no_test: true

models:
  source: results/stage9/ablation/models and the frozen stage-2 BASE-Z and SA-Z bundles
  names:
    BASE-Z: unstandardized pure tumors, C = 0.1
    PURE-Zs: standardized pure tumors, C = 0.03
    PURE-Zs-w: standardized pure tumors, C = 0.15
    MIX-Z0: unstandardized mixtures, C = 0.1
    SA-Z: HostMix-TOO

data_a:
  layer: microarray descriptive layer
  patient_rule: one sample per patient, the same filter as Table 1
  n_eval: 536
  n_at_risk: 207
  n_native_truth: 341
  scoring: the stage-7 microarray scoring rule

data_b:
  cohorts: [POG570, MET500]
  platforms: [GPL96, GPL20769, GPL15659, FHCRC Agilent]
  random_removals: 10
  seed: 20261023
  gene_sets: the same sets as the stage-9 missing-gene simulation

metrics_a:
  - top-1 accuracy on the evaluation set
  - host-attraction rate on the at-risk set
  - native-truth top-1 accuracy
  - number of esophagus calls in the evaluation set
  by: cohort and the pooled total

metrics_b:
  - drop in top-1 accuracy under the platform gene restriction
  - mean, minimum and maximum drop under ten random removals of the same count
  by: each of the eight platform-by-cohort combinations, and the mean of those eight

reading_rule:
  share_meaning:
    one: the model reproduces all of HostMix-TOO's loss
    zero: the model behaves like the baseline
  accuracy:
    A: top-1 accuracy on the evaluation set, n = 536
    g: A(BASE-Z) - A(SA-Z)
    s_mix: (A(BASE-Z) - A(MIX-Z0)) / g
    s_std: (A(BASE-Z) - A(PURE-Zs)) / g
    s_stdw: (A(BASE-Z) - A(PURE-Zs-w)) / g
  missing_genes:
    R: mean, over the eight combinations, of the mean drop under random gene removal; a positive value is a loss
    g2: R(SA-Z) - R(BASE-Z)
    if_g2_below_0.02: category Z and the shares are not interpreted
    s2_mix: (R(MIX-Z0) - R(BASE-Z)) / g2
    s2_std: (R(PURE-Zs) - R(BASE-Z)) / g2
    s2_stdw: (R(PURE-Zs-w) - R(BASE-Z)) / g2
  categories:
    S: s_mix < 0.5 and min(s_std, s_stdw) >= 0.5
    M: s_mix >= 0.5 and max(s_std, s_stdw) < 0.5
    B: s_mix >= 0.5 and min(s_std, s_stdw) >= 0.5
    O: none of S, M, B
  note: PURE-Zs and PURE-Zs-w also differ in C (0.03 and 0.15). The manuscript says "standardized features" only.

manuscript_sentences:
  results_microarray: |
    In the post hoc extension to the microarray layer (Additional file 1: Table S9), top-1 accuracy in the evaluation set (n = 536) was {{A_MIX}} for the unstandardized mixture model and {{A_PURE}} and {{A_PUREW}} for the two standardized pure-tumor models, compared with 0.724 for the baseline and 0.455 for HostMix-TOO; the shares of HostMix-TOO's loss reproduced by these three models were {{S_MIX}}, {{S_STD}} and {{S_STDW}}. The host-attraction rate in the at-risk set (n = 207) was {{H_MIX}} for the unstandardized mixture model, compared with {{H_BASE}} for the baseline and {{H_SA}} for HostMix-TOO. In the missing-gene simulation, removing as many randomly chosen classifier genes as each platform lacks lowered POG570 and MET500 top-1 accuracy by {{R_MIX}} on average for the unstandardized mixture model and by {{R_PURE}} and {{R_PUREW}} for the standardized pure-tumor models, compared with {{R_BASE}} for the baseline and {{R_SA}} for HostMix-TOO.
  discussion_S: "In the post hoc ablation, the models with standardized features, not the model trained with mixtures, reproduced most of HostMix-TOO's accuracy loss on microarray profiles (Additional file 1: Table S9)."
  discussion_M: "In the post hoc ablation, the model trained with mixtures, not the models with standardized features, reproduced most of HostMix-TOO's accuracy loss on microarray profiles (Additional file 1: Table S9)."
  discussion_B: "In the post hoc ablation, both the model trained with mixtures and the models with standardized features reproduced most of HostMix-TOO's accuracy loss on microarray profiles (Additional file 1: Table S9)."
  discussion_O: "The post hoc ablation did not attribute HostMix-TOO's accuracy loss on microarray profiles to either the mixtures or feature standardization (Additional file 1: Table S9)."
  discussion_sensitivity_S: "HostMix-TOO's greater sensitivity to missing genes was reproduced by the models with standardized features rather than by the model trained with mixtures."
  discussion_sensitivity_M: "HostMix-TOO's greater sensitivity to missing genes was reproduced by the model trained with mixtures rather than by the models with standardized features."
  discussion_sensitivity_B: "HostMix-TOO's greater sensitivity to missing genes was reproduced by both."
  discussion_sensitivity_O: "HostMix-TOO's greater sensitivity to missing genes was not attributed to either factor."
  discussion_sensitivity_Z: "The difference in sensitivity to missing genes between HostMix-TOO and the baseline was too small to attribute."
  discussion_D3: "Mixtures without feature standardization may therefore transfer better to such profiles; this remains to be tested."

output: results/stage10/ablation_microarray/
pog570_sample_level: internal only; not in the public package or the review pack
